<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Quiz Portal</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">

   
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>


<div class="container start-page text-center" id="startPage">
    <div class="card shadow p-4">
        <h2 class="mb-3">Welcome to Mini Quiz</h2>
        <p class="mb-4">5 MCQ Questions | Timer Based Quiz</p>
        <button class="btn btn-success btn-lg" id="startQuizBtn">
            Start Quiz
        </button>
    </div>
</div>


<div class="container quiz-box d-none" id="quizPage">
    <div class="card shadow">
        <div class="card-body">

            <h4 class="text-center mb-3">Mini Quiz Portal</h4>

            <div class="d-flex justify-content-between mb-2">
                <span>Question <span id="qno">1</span>/5</span>
                <span>⏱ Time: <span id="time">10</span>s</span>
            </div>

            <div class="progress mb-2">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progress"></div>
            </div>

            
            <div class="alert alert-warning text-center blink-note">
                ⚠️ Note: Once submitted, it will be the final answer.
            </div>

            <h5 id="question"></h5>

            <form id="quizForm">
                <div id="options" class="mt-3"></div>

                <button type="submit"
                        class="btn btn-primary w-100 mt-3"
                        id="submitBtn"
                        disabled>
                    Submit Answer
                </button>
            </form>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
