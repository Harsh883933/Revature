//map() – 10% Discount

//filter() – Available Products
let products = [
  { name: "Laptop", inStock: true },
  { name: "Mouse", inStock: false },
  { name: "Keyboard", inStock: true }
];

let availableProducts = products.filter(p => p.inStock);

console.log(availableProducts);

//reduce() – Cart Total
let cart = [500, 1500, 2000];

let total = cart.reduce((sum, price) => sum + price, 0);

console.log(total);

//Function Declaration vs Arrow Function
function calculateGST(price) {
  return price * 0.18;
}

const calculateGSTArrow = price => price * 0.18;

//Closures – Secure Counter
function counter() {
  let count = 0;

  return function () {
    count++;
    return count;
  };
}

let increment = counter();

console.log(increment()); // 1
console.log(increment()); // 2

//Callback Function – Login Validation
function validateUser(username, callback) {
  if (username === "admin") {
    callback("Login successful");
  } else {
    callback("Invalid user");
  }
}

validateUser("admin", message => {
  console.log(message);
});
